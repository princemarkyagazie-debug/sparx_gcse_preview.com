<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A small 3D browser mission game with keyboard and touch controls.">
  <title>Mini Mission 3D</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b16;color:#f8fafc}body{overflow:hidden}#game{position:fixed;inset:0;width:100vw;height:100vh;display:block}#ui{position:fixed;inset:0;pointer-events:none;padding:14px;display:flex;flex-direction:column;justify-content:space-between}.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.title{font-size:clamp(18px,4vw,28px);font-weight:800;text-shadow:0 2px 5px #000}.pill,button,input{border:1px solid #ffffff2b;background:#101a2ddd;color:#fff;border-radius:12px;padding:9px 12px;font:inherit}.pill{font-size:14px}.actions{display:flex;gap:8px;pointer-events:auto}.actions button{cursor:pointer}.name{display:flex;gap:7px;pointer-events:auto}.name input{width:150px;outline:none}.hint{opacity:.8;font-size:13px;margin:0 0 6px}.panel{pointer-events:auto;align-self:center;display:none;text-align:center;background:#0b1224ee;border:1px solid #ffffff2b;border-radius:16px;padding:18px;max-width:330px;box-shadow:0 12px 40px #0008}.panel.show{display:block}.panel h2{margin:0 0 8px}.panel button{cursor:pointer;margin-top:10px}.joystick{position:fixed;left:24px;bottom:25px;width:118px;height:118px;border-radius:50%;background:#ffffff18;border:2px solid #ffffff35;pointer-events:auto;touch-action:none}.stick{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:#5eead455;border:2px solid #99f6e455;box-shadow:0 0 18px #22d3ee55}.look{position:fixed;right:18px;bottom:24px;display:flex;gap:8px;pointer-events:auto}.look button{width:54px;height:48px;font-size:22px;touch-action:none}.task-dot{color:#67e8f9}@media (min-width:800px){.joystick,.look{opacity:.45}.joystick:hover,.look:hover{opacity:1}}
  </style>
</head>
<body>
  <canvas id="game" aria-label="3D mini mission game"></canvas>
  <div id="ui">
    <div>
      <div class="top"><div class="title">Mini Mission 3D</div><span class="pill" id="tasks">Tasks: 0 / 3</span><span class="pill" id="status">Playing</span><span class="pill" id="time">Time: 0s</span></div>
      <p class="hint">Move with WASD, arrow keys, or the on-screen joystick. Complete the glowing tasks and avoid the red impostor.</p>
      <div class="name"><input id="name" maxlength="16" placeholder="Your name" aria-label="Your player name"><button id="saveName" type="button">Set name</button></div>
    </div>
    <div class="panel" id="panel"><h2 id="panelTitle">Mission complete</h2><div id="panelText"></div><button id="restart" type="button">Play again</button></div>
    <div class="actions"><button id="help" type="button">How to play</button><button id="resetName" type="button">Reset name</button></div>
  </div>
  <div class="joystick" id="joystick" aria-label="Touch movement control"><div class="stick" id="stick"></div></div>
  <div class="look"><button id="left" type="button" aria-label="Turn left">↶</button><button id="right" type="button" aria-label="Turn right">↷</button></div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
  <script>
  (()=>{
    'use strict';
    const canvas=document.getElementById('game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x07111f);scene.fog=new THREE.Fog(0x07111f,18,42);
    const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,100);const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
    scene.add(new THREE.HemisphereLight(0x9bdcff,0x182038,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(7,12,6);sun.castShadow=true;scene.add(sun);
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(32,24),new THREE.MeshStandardMaterial({color:0x162338,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
    const grid=new THREE.GridHelper(32,32,0x2c5271,0x1b304b);grid.position.y=.012;scene.add(grid);
    const walls=[];function wall(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,1.6,d),new THREE.MeshStandardMaterial({color:0x334b68,roughness:.75}));m.position.set(x,.8,z);m.castShadow=m.receiveShadow=true;scene.add(m);walls.push({x,z,w,d});}
    wall(-5,-2,1,7);wall(1,-4,7,1);wall(5,2,1,7);wall(-1,4,7,1);wall(-1,-.5,3,1);wall(3,.5,1,3);
    function crewmate(color){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,.75,8,16),new THREE.MeshStandardMaterial({color,roughness:.55}));body.position.y=.72;body.castShadow=true;g.add(body);const visor=new THREE.Mesh(new THREE.SphereGeometry(.32,16,10),new THREE.MeshStandardMaterial({color:0x9eeaff,metalness:.35,roughness:.2}));visor.scale.set(1,.65,.25);visor.position.set(0,1.02,.48);g.add(visor);return g}
    const player=crewmate(0x39b8ff);scene.add(player);const enemy=crewmate(0xef4444);scene.add(enemy);const tasks=[{x:-6,z:-6,done:false},{x:6,z:-6,done:false},{x:6,z:6,done:false}];const taskMeshes=[];
    tasks.forEach(t=>{const b=new THREE.Mesh(new THREE.OctahedronGeometry(.42),new THREE.MeshStandardMaterial({color:0x67e8f9,emissive:0x0891b2,emissiveIntensity:2}));b.position.set(t.x,.65,t.z);b.castShadow=true;scene.add(b);taskMeshes.push(b)});
    const keys=new Set();let joy={x:0,y:0},angle=0,elapsed=0,ended=false,last=performance.now(),name=localStorage.getItem('missionName')||'Crewmate';document.getElementById('name').value=name;
    function blocked(x,z){if(Math.abs(x)>15||Math.abs(z)>11)return true;return walls.some(a=>Math.abs(x-a.x)<a.w/2+.55&&Math.abs(z-a.z)<a.d/2+.55)}
    function move(x,z){if(!blocked(player.position.x+x,player.position.z))player.position.x+=x;if(!blocked(player.position.x,player.position.z+z))player.position.z+=z}
    function finish(title,text){ended=true;document.getElementById('status').textContent=title;document.getElementById('panelTitle').textContent=title;document.getElementById('panelText').textContent=text;document.getElementById('panel').classList.add('show')}
    function reset(){player.position.set(-8,0,0);enemy.position.set(8,0,0);tasks.forEach(t=>t.done=false);taskMeshes.forEach(m=>m.visible=true);elapsed=0;ended=false;document.getElementById('panel').classList.remove('show');document.getElementById('status').textContent='Playing'}
    function hud(){document.getElementById('tasks').textContent=`Tasks: ${tasks.filter(t=>t.done).length} / ${tasks.length}`;document.getElementById('time').textContent=`Time: ${Math.floor(elapsed)}s`}
    function tick(now){const dt=Math.min((now-last)/1000,.05);last=now;if(!ended){elapsed+=dt;let x=(keys.has('d')||keys.has('ArrowRight')?1:0)-(keys.has('a')||keys.has('ArrowLeft')?1:0)+joy.x;let z=(keys.has('s')||keys.has('ArrowDown')?1:0)-(keys.has('w')||keys.has('ArrowUp')?1:0)+joy.y;const l=Math.hypot(x,z)||1;move(x/l*dt*5,z/l*dt*5);angle+=(keys.has('q')?-dt*2:0)+(keys.has('e')?dt*2:0);if(x||z)player.rotation.y=Math.atan2(x,z);const dx=player.position.x-enemy.position.x,dz=player.position.z-enemy.position.z,dl=Math.hypot(dx,dz)||1;enemy.position.x+=dx/dl*dt*1.35;enemy.position.z+=dz/dl*dt*1.35;if(dl<1.05)finish('Caught!','The impostor caught '+name+'.');tasks.forEach((t,i)=>{if(!t.done&&Math.hypot(player.position.x-t.x,player.position.z-t.z)<1){t.done=true;taskMeshes[i].visible=false}});if(tasks.every(t=>t.done))finish('Mission complete','Excellent work, '+name+'!');taskMeshes.forEach((m,i)=>{m.rotation.y+=dt*2;m.position.y=.65+Math.sin(now/300+i)*.08});hud()}
      const camTarget=new THREE.Vector3(player.position.x,1.1,player.position.z);const camPos=new THREE.Vector3(player.position.x+Math.sin(angle)*8,6.8,player.position.z+Math.cos(angle)*8);camera.position.lerp(camPos,.1);camera.lookAt(camTarget);renderer.render(scene,camera);requestAnimationFrame(tick)}
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{keys.add(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key));
    const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');function joyMove(e){const r=joyEl.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);joy={x:Math.cos(a)*d/42,y:Math.sin(a)*d/42};stick.style.transform=`translate(${joy.x*42}px,${joy.y*42}px)`}function joyEnd(){joy={x:0,y:0};stick.style.transform='translate(0,0)'}joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);joyMove(e)});joyEl.addEventListener('pointermove',e=>{if(e.buttons)joyMove(e)});joyEl.addEventListener('pointerup',joyEnd);joyEl.addEventListener('pointercancel',joyEnd);
    document.getElementById('left').onclick=()=>angle-=.35;document.getElementById('right').onclick=()=>angle+=.35;document.getElementById('restart').onclick=reset;document.getElementById('help').onclick=()=>alert('Complete all three glowing cyan tasks. Avoid the red impostor. Use WASD, arrow keys, the joystick, or the turn buttons.');document.getElementById('saveName').onclick=()=>{name=document.getElementById('name').value.trim()||'Crewmate';localStorage.setItem('missionName',name)};document.getElementById('resetName').onclick=()=>{localStorage.removeItem('missionName');document.getElementById('name').value='';name='Crewmate'};
    renderer.setSize(innerWidth,innerHeight);reset();requestAnimationFrame(tick);
  })();
  </script>
</body>
</html>
