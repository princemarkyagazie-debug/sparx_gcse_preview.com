<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>Sparx GCSE Preview</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101827; color: #f8fafc; }
    body { min-height: 100vh; display: grid; place-items: center; }
    .shell { width: min(100vw, 1280px); padding: 16px; }
    .game { position: relative; width: 100%; aspect-ratio: 16 / 9; min-height: 320px; overflow: hidden; border: 1px solid #334155; border-radius: 12px; background: #000; box-shadow: 0 20px 60px #0008; }
    #unity-canvas { display: block; width: 100%; height: 100%; background: #000; }
    #loading { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; background: #101827; text-align: center; }
    .loading-inner { width: min(460px, 100%); }
    .logo { font-size: clamp(1.25rem, 3vw, 2rem); font-weight: 750; margin-bottom: 20px; }
    .bar { height: 10px; overflow: hidden; border-radius: 999px; background: #334155; }
    #progress { width: 0%; height: 100%; border-radius: inherit; background: #38bdf8; transition: width .15s ease; }
    #status { margin-top: 12px; color: #cbd5e1; font-size: .95rem; }
    #error { display: none; margin-top: 12px; padding: 12px; border-radius: 8px; background: #7f1d1d; color: #fecaca; text-align: left; white-space: pre-wrap; }
    .hint { margin: 12px 0 0; color: #94a3b8; font-size: .85rem; text-align: center; }
    @media (max-width: 600px) { .shell { padding: 0; } .game { min-height: 220px; border-radius: 0; border-left: 0; border-right: 0; } .hint { padding: 0 12px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="game" aria-label="Sparx GCSE Unity WebGL game">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="loading">
        <div class="loading-inner">
          <div class="logo">Sparx GCSE Preview</div>
          <div class="bar" aria-hidden="true"><div id="progress"></div></div>
          <div id="status" role="status">Finding Unity WebGL build…</div>
          <div id="error" role="alert"></div>
        </div>
      </div>
    </section>
    <p class="hint">Click the game to focus it. Press Esc to release the mouse.</p>
  </main>

  <script>
    /*
     * Portable Unity WebGL launcher.
     *
     * Upload this file beside Unity's Build folder. It deliberately uses
     * relative URLs, so it works at a domain root, in a subfolder, on GitHub
     * Pages, or when copied into another site. You can also override the
     * location/name without editing this file:
     *   index.html?build=game&path=assets/Build
     *
     * Unity's generated files must be uploaded together:
     *   <path>/<name>.loader.js
     *   <path>/<name>.data[.br|.gz]
     *   <path>/<name>.framework.js[.br|.gz]
     *   <path>/<name>.wasm[.br|.gz]
     */
    (() => {
      const params = new URLSearchParams(location.search);
      const canvas = document.querySelector('#unity-canvas');
      const loading = document.querySelector('#loading');
      const progress = document.querySelector('#progress');
      const status = document.querySelector('#status');
      const errorBox = document.querySelector('#error');

      // Defaults cover Unity's usual output and can be changed by query string.
      const requestedName = (params.get('build') || params.get('name') || 'SparxGCSE').replace(/[^a-zA-Z0-9_.-]/g, '');
      const requestedPath = (params.get('path') || 'Build').replace(/^\/+|\/+$/g, '');
      const baseUrl = new URL('.', document.baseURI);
      const buildUrl = new URL(`${requestedPath}/`, baseUrl);
      const file = suffix => new URL(`${requestedName}.${suffix}`, buildUrl).href;

      function showError(message) {
        status.textContent = 'Unity could not be loaded.';
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.async = true;
          script.onload = resolve;
          script.onerror = () => reject(new Error(`Unity loader not found: ${src}`));
          document.head.appendChild(script);
        });
      }

      async function start() {
        const loader = file('loader.js');
        try {
          await loadScript(loader);
          if (typeof window.createUnityInstance !== 'function') {
            throw new Error('The Unity loader loaded, but createUnityInstance is unavailable.');
          }

          const config = {
            dataUrl: file('data'),
            frameworkUrl: file('framework.js'),
            codeUrl: file('wasm'),
            streamingAssetsUrl: new URL('StreamingAssets', buildUrl).href,
            companyName: 'Sparx GCSE Preview',
            productName: 'Sparx GCSE Preview',
            productVersion: '1.0',
            matchWebGLToCanvasSize: true,
            devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
          };

          await window.createUnityInstance(canvas, config, value => {
            const percent = Math.round(value * 100);
            progress.style.width = `${percent}%`;
            status.textContent = value >= 1 ? 'Starting game…' : `Loading Unity WebGL… ${percent}%`;
          });
          loading.style.display = 'none';
          canvas.focus();
        } catch (error) {
          console.error(error);
          showError(`${error.message}\n\nExpected Unity files in ${buildUrl.href} named ${requestedName}.loader.js, .data, .framework.js and .wasm.\n\nIf this page was copied, copy the complete Unity Build folder too. For a different folder/name use ?path=Build&build=YourBuildName.`);
        }
      }

      // Unity WebGL requires HTTP(S) for fetch/wasm in most browsers. Opening
      // index.html directly as file:// cannot reliably load a Unity build.
      if (location.protocol === 'file:') {
        showError('Please serve this folder from a web server instead of opening the HTML file directly. For example: python3 -m http.server 8000, then open http://localhost:8000/');
      } else {
        start();
      }
    })();
  </script>
</body>
</html>
